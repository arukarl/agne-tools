<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estonian Person Code Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="cards-wrapper">
        <!-- Vehicle Age Calculator -->
    <div class="container">
        <h1>📅 Sõiduki vanuse kalkulaator</h1>
        <p class="subtitle">Arvuta sõiduki vanus maksuaasta seisuga</p>

        <form id="ageForm">
            <div class="form-group">
                <label for="worldInitialRegDate">Maailma esmaregistreerimine</label>
                <input type="text" id="worldInitialRegDate" placeholder="01.01.2020" pattern="(\d{2}[./]\d{2}[./]\d{4}|\d{4}[-/]\d{2}[-/]\d{2})" required>
            </div>

            <div class="form-group">
                <label for="estInitialRegDate">Eestis esmaregistreerimine - valikuline</label>
                <input type="text" id="estInitialRegDate" placeholder="01.01.2024" pattern="(\d{2}[./]\d{2}[./]\d{4}|\d{4}[-/]\d{2}[-/]\d{2})">
            </div>

            <div class="form-group">
                <label for="regStartDate">Alustav toiming - valikuline</label>
                <input type="text" id="regStartDate" placeholder="15.06.2025" pattern="(\d{2}[./]\d{2}[./]\d{4}|\d{4}[-/]\d{2}[-/]\d{2})">
            </div>

            <div class="form-group">
                <label for="ageTaxYear">Maksuaasta</label>
                <input type="number" id="ageTaxYear" value="2025" min="2020" max="2100" required>
            </div>

            <button type="submit">Arvuta vanus</button>
            <button type="button" id="ageClearBtn" class="clear-btn">Tühjenda</button>
        </form>

        <div id="ageResult" class="result">
            <div class="result-label">Tulemus:</div>
            <div id="ageResultContent" style="font-size: 14px; line-height: 1.8;"></div>
        </div>
    </div>

    <!-- Person Code Generator -->
    <div class="container">
        <h1>🇪🇪 Isikukoodi Generator</h1>
        <p class="subtitle">Eesti isikukoodi generaator</p>

        <form id="idForm">
            <div class="form-group">
                <label>
                    <input type="radio" name="dateType" value="birthdate">
                    Sünnipäev (pp.kk.aaaa / aaaa-kk-pp)
                </label>
                <input type="text" id="birthdate" placeholder="01.01.2000" pattern="(\d{2}[./]\d{2}[./]\d{4}|\d{4}[-/]\d{2}[-/]\d{2})" disabled>
            </div>

            <div class="form-group">
                <label>
                    <input type="radio" name="dateType" value="adult18" checked>
                    18. sünnipäev (pp.kk.aaaa / aaaa-kk-pp)
                </label>
                <input type="text" id="adult18" placeholder="01.01.2018" pattern="(\d{2}[./]\d{2}[./]\d{4}|\d{4}[-/]\d{2}[-/]\d{2})" required>
                <a href="#" id="todayLink" class="today-link">Täna</a>
            </div>

            <div class="form-group">
                <label for="gender">Sugu</label>
                <select id="gender" required>
                    <option value="male">Mees</option>
                    <option value="female">Naine</option>
                </select>
            </div>

            <div class="form-group">
                <label for="serial">Kolm eelviimast numbrit (001-999)</label>
                <input type="number" id="serial" min="1" max="999" required>
            </div>

            <button type="submit">Genereeri isikukood</button>
        </form>

        <div id="result" class="result">
            <div class="result-label">Genereeritud isikukood:</div>
            <div class="result-code" id="generatedCode">-</div>
        </div>
    </div>

    <!-- CO2 Tax Calculator -->
    <div class="container">
        <h1>🚗 M1 sõidukimaksu Kalkulaator</h1>
        <p class="subtitle">Leia maksusumma järgi CO2 ja Eestis registreerimise kuupäev</p>

        <form id="taxForm">
            <div class="form-group">
                <label for="targetPrice">Soovitud maksusumma (EUR)</label>
                <input type="number" id="targetPrice" step="0.01" min="0" placeholder="150.43" required>
            </div>

            <div class="form-group">
                <label for="minDate">Minimaalne registreerimiskuupäev (pp.kk.aaaa / aaaa-kk-pp) - valikuline</label>
                <input type="text" id="minDate" placeholder="31.12.2024" pattern="(\d{2}[./]\d{2}[./]\d{4}|\d{4}[-/]\d{2}[-/]\d{2})">
            </div>

            <button type="submit">Arvuta</button>
        </form>

        <div id="taxResult" class="result">
            <div class="result-label">Tulemus:</div>
            <div id="taxResultContent" style="font-size: 14px; line-height: 1.8;"></div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
